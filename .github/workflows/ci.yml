name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Linux, as most people who build this will be on.
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  embedded-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: web/ui
    env:
      VIEWER_NPM_VERSION: '10.9.9'
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
      NPM_CONFIG_FETCH_RETRIES: '0'
      NPM_CONFIG_FETCH_TIMEOUT: '60000'
    steps:
      - id: viewer-source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: embedded-fonts
        name: Check the committed viewer fonts against the locked publications
        run: |
          timeout --kill-after=10s 65s python3 -B scripts/verify-embedded-fonts.py \
            --report "$RUNNER_TEMP/zcribe-embedded-fonts.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retain the checked-in font and notice evidence
        if: ${{ !cancelled() && (steps.embedded-fonts.outcome == 'success' || steps.embedded-fonts.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zcribe-embedded-fonts
          path: ${{ runner.temp }}/zcribe-embedded-fonts.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify that the checkout includes the viewer source inputs
        if: ${{ !cancelled() && steps.viewer-source.outcome == 'success' }}
        run: |
          missing=0
          for source in abi cbor envelope useWallet; do
            path="web/ui/src/wallet/$source.ts"
            entry="$(git -C ../.. ls-tree --full-tree HEAD -- "$path")"
            if [[ "$entry" != '100644 blob '* && "$entry" != '100755 blob '* ]]; then
              printf 'Missing tracked viewer input %s\n' "$path" | tee -a "$GITHUB_STEP_SUMMARY"
              missing=$((missing + 1))
            fi
          done
          if (( missing > 0 )); then
            printf 'Viewer source inputs are incomplete. %s tracked modules are missing.\n' "$missing" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf 'All four required viewer modules are tracked.\n' | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - name: Verify the toolchain and the committed viewer lock
        run: |
          config="$(mktemp -d "$RUNNER_TEMP/zcribe-viewer-config.XXXXXX")"
          : > "$config/user.npmrc"
          : > "$config/global.npmrc"
          export NPM_CONFIG_USERCONFIG="$config/user.npmrc"
          export NPM_CONFIG_GLOBALCONFIG="$config/global.npmrc"
          export NPM_CONFIG_CACHE="$RUNNER_TEMP/zcribe-viewer-npm"
          printf '%s\n' "NPM_CONFIG_USERCONFIG=$NPM_CONFIG_USERCONFIG" \
            "NPM_CONFIG_GLOBALCONFIG=$NPM_CONFIG_GLOBALCONFIG" "NPM_CONFIG_CACHE=$NPM_CONFIG_CACHE" >> "$GITHUB_ENV"
          test "$(node --version)" = v22.23.5
          test "$(npm --version)" = "$VIEWER_NPM_VERSION"
          node --version
          npm --version
          node scripts/verify-embedded-viewer.mjs inputs | tee -a "$GITHUB_STEP_SUMMARY"
      - id: viewer-install
        name: Install the locked viewer and verify the Git package source
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://github.com/digitalSloth/nom-ui.git.insteadOf
          GIT_CONFIG_VALUE_0: ssh://git@github.com/digitalSloth/nom-ui.git
        run: |
          timeout --kill-after=10s 180s npm ci --ignore-scripts --include=dev --include=optional --no-audit --no-fund --no-progress
          node scripts/verify-embedded-viewer.mjs installed | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Typecheck the locked viewer source
        if: ${{ !cancelled() && steps.viewer-install.outcome == 'success' }}
        run: timeout --kill-after=10s 60s npm run typecheck
      - name: Lint the locked viewer source
        if: ${{ !cancelled() && steps.viewer-install.outcome == 'success' }}
        run: timeout --kill-after=10s 60s npm run lint
      - name: Verify the viewer protocol vectors
        if: ${{ !cancelled() && steps.viewer-install.outcome == 'success' }}
        run: timeout --kill-after=10s 45s npm run verify:vectors
      - id: viewer-build
        name: Build one fresh viewer into the runner temporary directory
        if: ${{ !cancelled() && steps.viewer-install.outcome == 'success' }}
        run: |
          output="$RUNNER_TEMP/zcribe-viewer-dist"
          test ! -e "$output" && test ! -L "$output"
          timeout --kill-after=10s 90s npm run build -- --outDir "$output"
      - id: viewer-compare
        name: Compare the fresh viewer to the committed Go embed inputs
        if: ${{ !cancelled() && steps.viewer-build.outcome == 'success' }}
        run: |
          node scripts/verify-embedded-viewer.mjs compare "$RUNNER_TEMP/zcribe-viewer-dist" "$RUNNER_TEMP/zcribe-viewer.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retain the committed and rebuilt file digests
        if: ${{ !cancelled() && steps.viewer-compare.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zcribe-viewer-comparison
          path: ${{ runner.temp }}/zcribe-viewer.json
          if-no-files-found: error
          retention-days: 14
