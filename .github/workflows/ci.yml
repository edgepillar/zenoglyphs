name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Linux, as most people who build this will be on.
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOENV: 'off'
      GOWORK: 'off'
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOFLAGS: '-mod=readonly -trimpath'
      REVIEW_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
          persist-credentials: false
          allow-unsafe-pr-checkout: false
      - name: Exercise Go build and scan evidence checks
        run: python3 -B -m unittest discover -s tools -p 'test_*.py'
      - id: go-source
        name: Verify the selected Go and embedded viewer inputs
        run: |
          python3 -B tools/verify_go_inputs.py --source-commit "$REVIEW_SOURCE_COMMIT" \
            > "$RUNNER_TEMP/zcribe-go-source.json"

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: go.sum

      - name: Build the zcribe binary with the selected SDK
        run: |
          test "$(go env GOVERSION)" = go1.26.11
          go build -buildvcs=true -o "$RUNNER_TEMP/zcribe-ci" ./cmd/zcribe
      - run: go vet ./...
      - run: go test ./...
      - name: Verify the downloaded Go modules
        run: go mod verify
      - id: go-inputs
        name: Bind the built binary to its source and module checksums
        run: |
          python3 -B tools/verify_go_inputs.py --source-commit "$REVIEW_SOURCE_COMMIT" \
            --before "$RUNNER_TEMP/zcribe-go-source.json" --binary "$RUNNER_TEMP/zcribe-ci" \
            > "$RUNNER_TEMP/zcribe-go-inputs.json"
      - name: Install the pinned Go vulnerability scanner
        env:
          GOBIN: ${{ runner.temp }}/zcribe-review-tools
          GOFLAGS: '-trimpath'
          GOSUMDB: sum.golang.org
          GOPRIVATE: ''
          GONOSUMDB: 'none'
        run: timeout --kill-after=5s 90s go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
      - name: Review the zcribe source and binary with the pinned scanner
        run: |
          python3 -B tools/review_go_vulnerabilities.py --source-commit "$REVIEW_SOURCE_COMMIT" \
            --binary "$RUNNER_TEMP/zcribe-ci" --inputs "$RUNNER_TEMP/zcribe-go-inputs.json" \
            --scanner "$RUNNER_TEMP/zcribe-review-tools/govulncheck" \
            --report "$RUNNER_TEMP/zcribe-go-vulnerabilities.json"
      - id: go-notices
        name: Collect original notices for the selected Go packages
        if: ${{ !cancelled() && steps.go-inputs.outcome == 'success' }}
        run: |
          python3 -B tools/collect_go_notices.py --source-commit "$REVIEW_SOURCE_COMMIT" \
            --inputs "$RUNNER_TEMP/zcribe-go-inputs.json" --output "$RUNNER_TEMP/zcribe-go-notices"
      - name: Retain Go source notice evidence
        if: ${{ !cancelled() && steps.go-notices.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zcribe-go-notices
          path: ${{ runner.temp }}/zcribe-go-notices
          if-no-files-found: error
          retention-days: 14
      - name: Retain the Go build input records
        if: ${{ !cancelled() && steps.go-source.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zcribe-go-inputs
          path: |
            ${{ runner.temp }}/zcribe-go-source.json
            ${{ runner.temp }}/zcribe-go-inputs.json
            ${{ runner.temp }}/zcribe-go-vulnerabilities.json
          if-no-files-found: error
          retention-days: 14

  embedded-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: web/ui
    env:
      VIEWER_NPM_VERSION: '10.9.9'
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
      NPM_CONFIG_FETCH_RETRIES: '0'
      NPM_CONFIG_FETCH_TIMEOUT: '60000'
    steps:
      - id: viewer-source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: embedded-fonts
        name: Check the committed viewer fonts against the locked publications
        run: |
          timeout --kill-after=10s 65s python3 -B scripts/verify-embedded-fonts.py \
            --report "$RUNNER_TEMP/zcribe-embedded-fonts.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retain the checked-in font and notice evidence
        if: ${{ !cancelled() && (steps.embedded-fonts.outcome == 'success' || steps.embedded-fonts.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zcribe-embedded-fonts
          path: ${{ runner.temp }}/zcribe-embedded-fonts.json
          if-no-files-found: error
          retention-days: 14
      - id: viewer-preflight
        name: Verify the viewer source inputs and npm lock
        if: ${{ !cancelled() && steps.viewer-source.outcome == 'success' }}
        run: |
          node scripts/verify-embedded-viewer.mjs sources "$RUNNER_TEMP/zcribe-viewer-preflight.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retain the viewer source preflight result
        if: ${{ !cancelled() && (steps.viewer-preflight.outcome == 'success' || steps.viewer-preflight.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zcribe-viewer-preflight
          path: ${{ runner.temp }}/zcribe-viewer-preflight.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - name: Verify the toolchain and the committed viewer lock
        run: |
          config="$(mktemp -d "$RUNNER_TEMP/zcribe-viewer-config.XXXXXX")"
          : > "$config/user.npmrc"
          : > "$config/global.npmrc"
          export NPM_CONFIG_USERCONFIG="$config/user.npmrc"
          export NPM_CONFIG_GLOBALCONFIG="$config/global.npmrc"
          export NPM_CONFIG_CACHE="$RUNNER_TEMP/zcribe-viewer-npm"
          printf '%s\n' "NPM_CONFIG_USERCONFIG=$NPM_CONFIG_USERCONFIG" \
            "NPM_CONFIG_GLOBALCONFIG=$NPM_CONFIG_GLOBALCONFIG" "NPM_CONFIG_CACHE=$NPM_CONFIG_CACHE" >> "$GITHUB_ENV"
          test "$(node --version)" = v22.23.5
          test "$(npm --version)" = "$VIEWER_NPM_VERSION"
          node --version
          npm --version
          node scripts/verify-embedded-viewer.mjs inputs | tee -a "$GITHUB_STEP_SUMMARY"
      - id: viewer-install
        name: Install the locked viewer and verify the Git package source
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://github.com/digitalSloth/nom-ui.git.insteadOf
          GIT_CONFIG_VALUE_0: ssh://git@github.com/digitalSloth/nom-ui.git
        run: |
          timeout --kill-after=10s 180s npm ci --ignore-scripts --include=dev --include=optional --no-audit --no-fund --no-progress
          node scripts/verify-embedded-viewer.mjs installed | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Typecheck the locked viewer source
        if: ${{ !cancelled() && steps.viewer-install.outcome == 'success' }}
        run: timeout --kill-after=10s 60s npm run typecheck
      - name: Lint the locked viewer source
        if: ${{ !cancelled() && steps.viewer-install.outcome == 'success' }}
        run: timeout --kill-after=10s 60s npm run lint
      - name: Verify the viewer protocol vectors
        if: ${{ !cancelled() && steps.viewer-install.outcome == 'success' }}
        run: timeout --kill-after=10s 45s npm run verify:vectors
      - id: viewer-build
        name: Build one fresh viewer into the runner temporary directory
        if: ${{ !cancelled() && steps.viewer-install.outcome == 'success' }}
        run: |
          output="$RUNNER_TEMP/zcribe-viewer-dist"
          test ! -e "$output" && test ! -L "$output"
          timeout --kill-after=10s 90s npm run build -- --outDir "$output"
      - id: viewer-compare
        name: Compare the fresh viewer to the committed Go embed inputs
        if: ${{ !cancelled() && steps.viewer-build.outcome == 'success' }}
        run: |
          node scripts/verify-embedded-viewer.mjs compare "$RUNNER_TEMP/zcribe-viewer-dist" "$RUNNER_TEMP/zcribe-viewer.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retain the committed and rebuilt file digests
        if: ${{ !cancelled() && steps.viewer-compare.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zcribe-viewer-comparison
          path: ${{ runner.temp }}/zcribe-viewer.json
          if-no-files-found: error
          retention-days: 14
